project:
  name: "MachineInnovators Sentiment Monitoring"
  version: "1.0.0"
  description: "learning Sentiment Analysis Pipeline and Monitoring for MachineInnovators Inc."

model:
  name: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  max_length: 512
  num_labels: 3
  labels: ["negative", "neutral", "positive"]

data:
  dataset_name: "cardiffnlp/tweet_eval"
  dataset_subset: "sentiment"
  test_sample_path: "data/processed/test_sample.csv"
  metrics_output_path: "data/metrics.json"
  sample_size: 200
  random_seed: 42

quality_gate:
  # Soglie minime per far passare la CI (Quality Gate)
  min_accuracy: 0.70
  min_f1_macro: 0.70

retraining:
  output_dir: "models/retrained_model"
  epochs: 1
  batch_size: 16
  learning_rate: 0.00002
  # Il nuovo modello viene promosso solo se supera il F1-Score corrente di questo delta minimo
  min_f1_improvement: 0.005

monitoring:
  log_file: "data/predictions_log.csv"
  baseline_file: "data/processed/baseline_data.csv"
  # Soglia p-value per il test Kolmogorov-Smirnov su Data Drift (Confidenza)
  ks_pvalue_threshold: 0.05
  # Soglia percentuale aumento relativo della classe negativa per allarme reputazionale
  concept_drift_negative_spike_threshold: 0.20
